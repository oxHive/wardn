name: Pull Request

on:
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    # wardn's tests each open their own libSQL file via tempfile — no
    # external database service needed, unlike the old Postgres/sqld-backed
    # proxy this replaced.
    steps:
      - uses: oxHive/pipelines/.github/actions/rust-check@v2
