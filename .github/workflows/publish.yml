name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      id-token: write
      contents: write
      pull-requests: read
      checks: write
    uses: oxHive/pipelines/.github/workflows/rust-release.yml@v2
    with:
      package-name: wardn
      binary-name: wardn
    secrets: inherit
