[package]
name = "wardn"
version = "0.1.0"
edition = "2024"
description = "Open source org & access layer for Mynd — org, member, and role management, plus the authorization service Mynd calls before touching org-layer memory"
license = "AGPL-3.0-or-later"
repository = "https://github.com/oxhive/warden"

[lib]
name = "wardn"
path = "src/lib.rs"

[[bin]]
name = "wardn"
path = "src/main.rs"

[dependencies]
libsql = { version = "0.6", features = ["core"] }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
argon2 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
anyhow = "1"
thiserror = "1"
reqwest = { version = "0.12", features = ["json"] }
dirs = "5"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
