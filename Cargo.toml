[package]
name = "hivemind-gateway"
version = "0.1.0"
edition = "2024"

[lib]
name = "hivemind_gateway"
path = "src/lib.rs"

[[bin]]
name = "hivemind-gateway"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "migrate", "uuid", "chrono"] }
chrono = "0.4"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
http-body-util = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# Test-only HTTP client, used to drive sqld's admin API from the integration
# tests. The gateway itself proxies with hyper/hyper-util (see src/proxy.rs).
reqwest = { version = "0.12", features = ["stream"] }
bytes = "1"
