[package]
name = "hivewarden"
version = "0.1.0"
edition = "2024"

[lib]
name = "hivewarden"
path = "src/lib.rs"

[[bin]]
name = "hivewarden"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "migrate", "uuid", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
base64 = "0.22"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
http-body-util = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
serde = { version = "1", features = ["derive"] }
# Simple JSON client for sqld's admin API (database provisioning,
# src/provisioning.rs) — the data-plane proxy itself still uses
# hyper/hyper-util directly (see src/proxy.rs) for streaming and
# protocol-accurate HTTP/1.1-vs-h2c forwarding, which reqwest doesn't give
# fine-grained enough control over.
reqwest = { version = "0.12", features = ["stream"] }
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
tower_governor = "0.8.0"
opentelemetry = "0.32.0"
opentelemetry_sdk = "0.32.1"
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.33.0"
tracing-loki = "0.2.7"
url = "2.5.8"
tower-http = { version = "0.7.0", features = ["trace", "cors"] }

[dev-dependencies]
bytes = "1"
serde_json = "1"
# `test-util` gives tests `tokio::time::pause()` — the only way to exercise
# `proxy.rs`'s 30s `RESPONSE_HEAD_TIMEOUT` without spending 30s. Dev-only, so
# the shipped binary never carries the mock clock.
tokio = { version = "1", features = ["test-util"] }
